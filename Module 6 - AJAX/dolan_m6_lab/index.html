<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fun Sizes Page</title>
    <style>
        .fun{
            color: red;
        }
    </style>
</head>
<body style="height:1500px">
    <p>Scroll down this page</p>
    <p id="testP" style="position:fixed">When you have scrolled 30 pixels from the top of this page, add the class "test" (red text color) to this paragraph. Scroll up again to remove the class.</p>
    <script>
        window.onscroll = function() {myFunction()};
        function myFunction() {
            if (document.body.scrollTop > 30 || document.documentElement.scrollTop > 30) {
                document.getElementById("testP").className = "fun";
            } else {
                document.getElementById("testP").className = "";
            }
        }
    </script>
</body>
</html>
